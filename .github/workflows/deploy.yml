name: Deploy Next.js to aaPanel

on:
  push:
    branches:
      - production # Pastikan ini sesuai dengan branch utama di repository kamu

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Masuk ke direktori project web smart farm kamu
            cd /www/wwwroot/web-smartfarm/

            # 2. Ambil update terbaru dan paksa sinkronisasi dengan GitHub
            git fetch --all
            git reset --hard origin/production

            # 3. CLEAN INSTALL: Hapus node_modules, cache .next, dan lockfile yang corrupt
            echo "Membersihkan cache build dan node_modules..."
            rm -rf node_modules
            rm -rf .next
            rm -f package-lock.json

            # 4. Install dependencies (Fresh Install)
            echo "Menginstal ulang dependencies..."
            npm install
            
            # (Opsional) Jika Turbopack masih bentrok dengan jose, uncomment baris di bawah ini:
            # npm install jose@latest

            # 5. Build aplikasi Next.js menjadi production-ready
            echo "Memulai proses build..."
            npm run build

            # 6. Restart service Node.js di aaPanel menggunakan PM2
            echo "Merestart aplikasi..."
            pm2 restart web_smartfarm || pm2 start npm --name "web_smartfarm" -- run start
            pm2 save