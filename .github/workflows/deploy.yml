name: Deploy Next.js to aaPanel

on:
  push:
    branches:
      - production # Pastikan ini sesuai dengan branch utama di repository kamu

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Masuk ke direktori project web smart farm kamu
            cd /www/wwwroot/web-smartfarm/

            # 2. Bersihkan konflik lokal dan Tarik update kode terbaru dari GitHub
            git reset --hard HEAD
            git pull origin production

            # 3. Install dependencies (package.json)
            npm install

            # 4. Build aplikasi Next.js menjadi production-ready
            npm run build

            # 5. Restart service Node.js di aaPanel
            pm2 restart web_smartfarm || pm2 start npm --name "web_smartfarm" -- run start
            pm2 save
            echo "Deployment completed successfully!"